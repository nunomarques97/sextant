# Pre-registered specification for SEXTANT-006 family F1, cash-and-carry.
#
# The machine-readable half of docs/PRE-REGISTRATION-006-F1.md. Committed BEFORE
# the grid runs, in its own commit, so that the git history is itself the evidence
# that nothing here was chosen after somebody saw a return.
#
# Two mechanisms make that evidence more than an assertion:
#
#   1. THE DRIFT GUARD. sextant.app.spike_006_f1.assert_no_drift compares every
#      number below against the constant the code will actually use and refuses to
#      start if they disagree. A specification that can silently differ from the
#      code it specifies is not a specification.
#
#   2. THE ORDERING AUDIT. The drift guard proves code and config agree *now*; it
#      cannot prove they were not edited together after a result was seen. Git can.
#      The runner refuses to start unless this file is committed and clean, records
#      the commit SHA it read into the results, and the report cites that SHA
#      beside the SHA of the commit that introduced the results, with the ancestry
#      between them verified. See the `provenance` block at the end.
#
#   3. THE TRIAL BUDGET. `trial_budget` below is enforced, not described. The
#      runner charges one trial per variant per cost cell before the engine runs,
#      refuses an unregistered variant or cell outright, and refuses everything
#      once the declared allowance is spent. A budget nothing enforces is not a
#      budget.
#
# If any value here turns out to be wrong, the correction gets a NEW version
# identifier, a NEW commit, and a full rerun. Both results are retained. Nothing
# here is ever edited in place once a result has been published against it.

version: v2.3
family: F1
family_name: cash-and-carry, funding and basis
registered_on: 2026-09-10
supersedes: null
amendments:
  - id: amendment-1
    document_section: "16"
    subject: >
      The decay expectation D1, the per-calendar-year decomposition, the standalone
      recent-24-month window as criterion 6, the maintenance margin as an assumption
      at three settings, and the bookDepth capacity sample.
  - id: amendment-2
    document_section: "17"
    subject: >
      Three rules on how a capacity figure may be reported, and the correction that
      0.025 maintenance margin is a stress level rather than a candidate rate.
  - id: amendment-3
    document_section: "18"
    subject: >
      The trial budget is enforced by the runner rather than described in prose, and
      the pre-registration ordering is auditable from the report through git.
  - id: amendment-4
    document_section: "26"
    subject: >
      The July 2026 contraction is described by composition and not only by size, and
      the best variant is re-costed once at the execution venue's published fee
      schedule. Both are reporting additions; no criterion, variant, cell, threshold
      or budget changes.
  - id: amendment-5
    document_section: "27"
    subject: >
      The execution-venue re-cost is reported as a break-even turnover rather than as a
      pass or fail, with declared expectation D2 on holding period being the binding
      constraint. A reframing of one output; no new run, no criterion, no budget.
  - id: amendment-12
    document_section: "34"
    subject: >
      The settlement of section 33.7. None of its three options is adopted as stated.
      The ASSUMPTION is kept as the number every criterion is evaluated against, the
      MEASURED figure is reported beside it on every headline as a bound, and a
      divergence between the two becomes a defined outcome - spread-contingent - rather
      than a judgement call. Rule E1's failure clause is honoured exactly as written:
      it said keep the assumption, and the assumption is kept and alone decides whether
      a family passes. What it never said, and what A12.1 adds, is that the assumption
      may not be the only number a reader sees. Also: the turnover-cut bands are
      defective and are re-cut under rule B1; the mid and thin band defaults are
      extrapolation from a band they are not in and are measured under rule M1;
      historical quoted spread is established under rule H1 but only if a family is
      recorded spread-contingent; the bound is registered as a sensitivity and not a
      trial; the 10 bps figure is relabelled a registered UPPER BOUND everywhere; the
      E1 result is kept as a methodological finding; and the FX conversion line is
      verified against an invariant that says it must scale with currency crossings and
      never with turnover.
  - id: amendment-11
    document_section: "33"
    subject: >
      Three settlements, every one prospective from F2, none of which touches an F1
      figure, an F1 criterion or F1's verdict letter. ONE: rule S1's floor is anchored
      to ZERO rather than to the null, and both of its clauses must hold - the
      counterfactual Sharpe must exceed zero by at least one standard error of its own
      estimate AND clear the 95th percentile of its own exposure-matched null. TWO:
      rule P1, a standing pairing rule - every criterion that compares a variant to a
      null is paired with an absolute test against zero, and criterion 1 is
      strengthened from F2 to require a return distinguishable from zero by its own
      standard error. THREE: rule E1 - the banded spread assumption is replaced from F2
      by a low-frequency spread ESTIMATE per instrument and per period, Abdi and
      Ranaldo 2017 as the registered estimator, calibrated against the 36 symbol-days
      of measured quotes and adopted only if it passes a test written and committed
      before the calibration was computed.
  - id: amendment-10
    document_section: "32"
    subject: >
      Three things, all prospective except the first. The Product Owner's drafting
      defect in amendment 9 is recorded and attributed rather than repaired by
      amending the rule out of the action it required. Rule S1 gains a floor FROM F2:
      the counterfactual must clear the null's 95th percentile by at least one
      standard error of its own Sharpe estimate, skew- and kurtosis-corrected. And the
      spread measured under S1 becomes the DEFAULT cost for F2 onward, with the
      registered assumption retained beside it as a labelled alternative. F1 is
      unchanged in every respect: it is judged by the bar registered when it ran, and
      remains costed at the assumption in every cell.
  - id: amendment-9
    document_section: "31"
    subject: >
      Rule S1 generalised so it governs every family rather than only F1, and two
      findings recorded so F2 onward does not rediscover them. An assumed cost is
      measured only when it could plausibly be carrying the verdict, and the test is
      computed: set the assumed cost to zero, re-evaluate, and acquire when some
      variant would then clear CRITERION 1. A sign change alone is not a rescue.
      Registered AFTER F1's figures were read, on the Product Owner's instruction, and
      it changes F1's acquisition answer from no to yes. It changes no F1 result: every
      variant stays costed at the assumption under invariant 12, and a measurement
      placed beside an assumption cannot move a number computed from the assumption.
  - id: amendment-8
    document_section: "30"
    subject: >
      Two corrections, one of authority and one of sequencing. The PRODUCT OWNER, never
      the Developer, declares a run void: the party that produced a run must not be the
      party that decides it did not happen. And section 12's spread sample is acquired
      only if rule S1's computed condition on the result file holds, namely that some
      registered variant earns a positive net return at research fees. Registered before
      any figure of the second execution had been read. Changes no variant, cell,
      criterion, threshold or budget.
  - id: amendment-7
    document_section: "29"
    subject: >
      How a void execution is counted. What makes a run void is a statement about the
      machinery and never about the result; the Product Owner declares it (amendment 8
      fixes the role, which this entry originally left as the Sponsor), on a written
      reason naming a defect a test now covers; the rows stay in the append-only
      registry and are counted in full by the Deflated Sharpe Ratio; the deflation
      cost of the repeat is reported as a pair, and the verdict follows the full
      count. A family may be re-executed at most twice, after which it is suspended
      and reported as (C). Written after the first execution was found void and
      before any figure of the second had been read.
  - id: amendment-6.1
    document_section: "28.6"
    subject: >
      What happens between quarterly rebalances and before the first one, stated so a
      competent stranger reproduces the same numbers. A sourced delisting still forces
      an exit; a pair leaving the carry universe is dropped and never re-bought; the
      freed capital sits idle rather than concentrating the rest; nothing is held before
      the first rebalance instant and the affected months are reported. Resolves what
      28.2 left implicit, changes no registered choice, adds no variant, committed
      before the runner produced a number.
  - id: amendment-6
    document_section: "28"
    subject: >
      One added variant, carry-rank90-10-quarterly: the same signal and position count
      at a quarterly cadence, filling the slow-and-funding-aware cell the eight left
      empty. The budget goes from 32 to 36. Written before the runner existed, with no
      variant's return, Sharpe or turnover computed. The last amendment: the grid closed
      when the runner started.
  - id: part-2
    document_section: 19-25
    subject: >
      The dataset section: what was acquired, where the three trees disagree, the
      holes in the published funding and what the registered rule does about them,
      the resolved window, the carry universe per rebalance and what each rule
      excluded. Measured after acquisition and committed before any strategy result.
      Every figure is also in research/spike-006-f1-dataset.json, which is the single
      copy.

# ---------------------------------------------------------------------------
# The hypothesis
# ---------------------------------------------------------------------------
hypothesis:
  statement: >
    Over the evaluation window and across the regimes it contains, at least one of
    the eight cash-and-carry variants specified below earns an out-of-sample,
    net-of-cost return in EUR that is not explained by chance selection, not
    explained by reduced market exposure, survives deflation by the honest count of
    every trial in this task, and is still present in the most recent 24 scored
    months.
  rejected_when: >
    No variant clears criterion 1. That is a complete answer for this family and is
    recorded as verdict (B).
  undetermined_when: >
    One or more variants clear criterion 1 but the statistics cannot separate edge
    from noise at the available effective sample size, or the recent window is too
    short to say whether the edge survives. Recorded as verdict (C), which is never
    presented as a softened (A).

# ---------------------------------------------------------------------------
# The research boundary
# ---------------------------------------------------------------------------
venue:
  spot: binance
  perpetual: binance_perp
  role: research venue only
  boundary: >
    No result computed here is evidence that any strategy is executable on Kraken,
    or that this account may trade perpetual futures on Binance at all. That
    question is separate and remains open. Nothing here is a live-trading decision;
    docs/LIVE-GATES.md is unaffected.

# ---------------------------------------------------------------------------
# The trial budget, declared before anything runs and enforced by the runner
# ---------------------------------------------------------------------------
#
# Document section 3. The budget is the exact grid rather than a ceiling with a
# reserve behind it: a reserve is what gets spent after a result is seen, so the
# type refuses a maximum that exceeds variants * cost_cells.
#
# Nulls, benchmarks and decomposition constructs are NOT charged. They are not
# attempts at finding an edge, and charging them would make running more of them -
# the honest thing - consume the allowance. They are counted in full in
# research/trial-registry.jsonl, which is what the Deflated Sharpe Ratio reads.
trial_budget:
  family: F1
  engine_version: sextant-006-f1
  maximum_trials: 36
  charged_per: one strategy trial per registered variant per registered cost cell
  variants:
    - carry-basket-5
    - carry-basket-10
    - carry-rank30-5
    - carry-rank30-10
    - carry-rank90-5
    - carry-rank90-10
    - carry-premium-10
    - carry-positive-10
    - carry-rank90-10-quarterly
  cost_cells:
    - vip0_maker
    - vip0_even
    - vip0_taker
    - stress
  nulls_are_charged: false
  enforcement:
    unregistered_variant: refused
    unregistered_cost_cell: refused
    exhausted_allowance: refused
    charge_happens: before the engine runs, never after a result exists
    rerun_is_idempotent: >
      Charging is idempotent on the variant/cell pair, so re-running the whole grid
      spends the allowance once rather than twice. A budget that broke on a rerun
      would be a budget that discouraged reproducing a result.
  on_exhaustion: >
    F1 is closed. No tenth variant, no adjusted parameter, no additional lookback,
    no further cell, no further cadence. If the eight did not clear the criteria, that is the answer.
  post_hoc_policy: >
    Anything tested in this family beyond the eight is post-hoc by construction. It
    requires a new pre-registered version committed before it is considered, counts
    in full in the registry, and is reported in its own section with the reason it
    was added.

# ---------------------------------------------------------------------------
# Void executions and how the registry counts them (amendment 29)
# ---------------------------------------------------------------------------
void_runs:
  what_makes_a_run_void:
    - a registered parameter was not read by the code path that ran
    - an accounting identity failed
    - the dataset changed underneath the run
    - the run did not complete
  never_void_because: >
    the answer was disliked, surprising, worse than expected, or worse than another
    run's. No property of the RETURNS can make a run void. A reason mentioning a
    Sharpe, a net return, a criterion or a verdict letter is not a voiding reason.
  declared_by_role: product-owner
  never_declared_by_role: developer
  declared_by: >
    the Product Owner, in writing, naming the clause of what_makes_a_run_void that
    applies and the specific defect. NEVER the Developer. The reason is conflict of
    interest rather than seniority: the party that produced a run must not be the party
    who decides it did not happen, or a run can be discarded and the discarding called a
    repair. The Developer names the defect and exhibits the regression test that now
    covers it; the declaration is the Product Owner's, and it is refused if the reason
    offered mentions a return, a Sharpe, a criterion or a verdict letter.
  declaration_requires: >
    a defect that a regression test now covers. A void run whose cause is not tested
    will happen again, and the second occurrence would be indistinguishable from an
    excuse.
  rows_are_deleted: false
  rows_are_counted_by_the_dsr: true
  rows_carry_a_note: >
    every row written by a re-execution states, in its note field, why the previous
    execution was void, so the registry is self-describing.
  deflation_reported_as_a_pair: >
    the DSR at the registry's full count, which every criterion is judged on, and the
    DSR excluding void executions, reported for information and never used. If the two
    straddle 0.95 the verdict says so in those words and follows the full count.
  maximum_re_executions: 2
  on_exceeding_it: >
    the family is suspended rather than re-executed and its verdict is reported as
    (C), naming every defect found. (C) is the honest answer: the apparatus could not
    be made trustworthy inside the budget. Never converted to (A) or (B) by a fourth
    attempt inside this task.
  grants_no_trial: true
  relaxes_no_threshold: true

# ---------------------------------------------------------------------------
# The account
# ---------------------------------------------------------------------------
account:
  currency: EUR
  equity: "1500"
  max_positions: 10
  margin_fraction: "0.20"
  margin_fraction_status: >
    An assumption, labelled as one everywhere. 0.20 means the futures leg is opened
    at five times leverage against the capital set aside for it, far inside what the
    venue permits on a major, chosen to be conservative rather than representative.
    The venue publishes no historical margin tiers, so no measured value exists.
  min_notional_fraction: "0.25"
  lot_rounding_fraction: "0.01"

# ---------------------------------------------------------------------------
# What a carry position is
# ---------------------------------------------------------------------------
carry_position:
  definition: >
    Long spot and short perpetual on the same base asset, equal base quantity, so
    the pair holds the basis plus the funding stream and has no term in the asset's
    own price.
  leg_weight_formula: "1 / (positions * (1 + margin_fraction))"
  gross_exposure_formula: "2 / (1 + margin_fraction)"
  net_exposure: "0"
  weight_denominator: >
    The REGISTERED position count, never the number of pairs actually opened.
    Rescaling to full investment would erase the exposure difference the timing null
    exists to measure.
  funding_sign_convention: >
    value * rate on signed position values, so a short leg with a positive rate
    produces a negative cost line, which is a receipt. Funding is a realised,
    exactly timestamped cash flow read from the venue's own published settlements,
    never an assumed rate.

# ---------------------------------------------------------------------------
# Universe construction
# ---------------------------------------------------------------------------
universe:
  quote_policy: USDT
  quote_policy_note: >
    USDT on both legs. There is no EUR-quoted perpetual on this venue, so the
    secondary EUR policy SEXTANT-005 ran has no counterpart here and is not
    registered. Every reported figure is still in EUR.
  rules_in_order:
    - name: paired_symbols
      admits: >
        assets for which the venue publishes both AUSDT spot and AUSDT perpetual, by
        EXACT base-asset match. A scaled-unit perpetual such as 1000PEPEUSDT is
        excluded, because pairing it with PEPEUSDT spot needs a unit-conversion rule
        and a rule invented here is a degree of freedom exercised after the data was
        seen. The count lost to this is reported.
    - name: sourced_membership_both_legs
      admits: >
        assets whose spot listing calendar and perpetual listing calendar both say
        LISTED at the rebalance instant. UNDETERMINED is neither admitted nor
        rejected; it is counted and reported.
    - name: listing_age
      minimum_days: 180
      measured_on: the perpetual leg's earliest sourced listing instant
    - name: funding_evaluability
      requires: >
        a published funding settlement for every settlement instant in the trailing
        30 days. A gap disqualifies.
      trailing_days: 30
    - name: median_quote_volume
      minimum: "250000"
      statistic: the perpetual's trailing 30-day median daily quote turnover
      minimum_observations: 20
    - name: bar_coverage
      requires: >
        both legs have a closed daily bar at both ends of the longest lookback the
        variant uses, and at least 90 per cent of the daily bars in between.
      minimum_fraction: "0.90"
    - name: excluded_asset_class
      excludes: >
        stablecoin bases, wrapped duplicates, leveraged tokens and staked
        derivatives, by the frozen list in sextant.app.spike.EXCLUDED_BASES plus the
        leveraged-token stem rule.
  leveraged_token_suffix_rule:
    excluded_base_suffixes: ["UP", "DOWN", "BULL", "BEAR"]
  carried_unchanged_from_spike_005: [listing_age, median_quote_volume, excluded_asset_class]
  carried_unchanged_note: >
    At the same thresholds, so no result here can be attributed to a universe screen
    retuned for a new dataset. Rules 1 and 4 are new and exist because a paired
    construction and a funding stream are new.
  membership_source:
    method: monthly file presence in the venue's public archive
    tree: klines
    tree_note: >
      Presence is taken from the KLINE tree and not the funding tree. 1,135
      kline-months carry no funding object, so using funding presence would delist a
      contract on a missing cash-flow file.
    provenance: venue_archive

# ---------------------------------------------------------------------------
# The window and the walk-forward structure
# ---------------------------------------------------------------------------
window:
  first_usable_month_rule: >
    The earliest month start T such that a venue-sourced EUR conversion rate exists
    for every day from T onward; T is at least 300 days after the first day the
    archive holds a bar for the FX pair, so the 180-day listing age, the 90-day
    longest lookback and the 30-day turnover window are all satisfiable with a
    ragged-edge month to spare; and the carry universe is non-empty at T and at
    every subsequent rebalance.
  first_usable_month_lookback_days: 300
  last_usable_month_end_rule: >
    The end of the last month M for which the archive holds a complete monthly
    object set for both M and M+1, in every tree the family reads. M+1 is required
    because a symbol absent from the final published month cannot be distinguished
    from a symbol whose final object has not been published yet.
  minimum_months_to_proceed: 36
  minimum_months_note: >
    Below 36 usable months this family reports verdict (C) on sample size alone and
    runs no variant. Same floor as SEXTANT-005, fixed before the window was resolved
    so the decision to stop cannot be talked out of later.
  rebalance: first instant of each calendar month, 00:00:00 UTC
  plans:
    walk_forward:
      in_sample_months: 12
      fold_count: 4
      fold_length: "(usable_months - 12) / 4, floored, remainder left off the end"
      positions_carry_across_folds: true
      liquidates: last fold only
  nothing_is_fitted: >
    Every variant's parameters are fixed below and no procedure chooses among them.
    The walk-forward structure is kept unchanged anyway, because the benchmarks and
    nulls run through it and a construct measured over a different window from the
    thing it benchmarks is not a benchmark. The first twelve months are held back
    and never scored.

# ---------------------------------------------------------------------------
# Costs
# ---------------------------------------------------------------------------
costs:
  cells:
    - label: vip0_maker
      spot_maker_bps: "10"
      spot_taker_bps: "10"
      futures_maker_bps: "2"
      futures_taker_bps: "5"
      maker_fraction: "1.00"
      is_headline: false
      runs_nulls: false
      what_it_is: the venue's published VIP 0 schedules, both legs assumed to rest
    - label: vip0_even
      spot_maker_bps: "10"
      spot_taker_bps: "10"
      futures_maker_bps: "2"
      futures_taker_bps: "5"
      maker_fraction: "0.50"
      is_headline: true
      runs_nulls: true
      what_it_is: the headline cell; every criterion is judged here
    - label: vip0_taker
      spot_maker_bps: "10"
      spot_taker_bps: "10"
      futures_maker_bps: "2"
      futures_taker_bps: "5"
      maker_fraction: "0.00"
      is_headline: false
      runs_nulls: false
      what_it_is: both legs assumed to cross
    - label: stress
      spot_maker_bps: "10"
      spot_taker_bps: "10"
      futures_maker_bps: "2"
      futures_taker_bps: "5"
      maker_fraction: "0.00"
      spread_and_slippage_multiplier: "2"
      is_headline: false
      runs_nulls: true
      what_it_is: taker, and spread and slippage at twice the assumption on both legs
  headline_is_the_middle_cell: >
    Not the cheapest. SEXTANT-005 judged at the venue's own schedule because maker
    and taker were equal there and the fill mix could not move the answer. Here they
    are not equal, so the fill mix is a live assumption and the headline must not sit
    at the flattering end of it.
  liquidity_bands:
    deep_floor: "5000000"
    mid_floor: "1000000"
    statistic: trailing median daily quote turnover
  spread_bps:
    deep: "10"
    mid: "25"
    thin: "60"
    unknown: "60"
  slippage_bps:
    deep: "5"
    mid: "10"
    thin: "25"
    unknown: "25"
  assumption_status: >
    Spread and slippage are ASSUMPTIONS, not measurements, and every report line
    says so. Identical to SEXTANT-005's, deliberately, so no question of retuning
    arises. They are charged on BOTH legs, so a carry round trip costs twice what a
    single-leg strategy pays. That is the central reason a small carry can fail to
    survive.
  charged_on_both_legs: true
  delisting_haircut_fraction: "0.20"
  haircut_is_a_loss_on_either_side: true
  funding_is_not_a_cost_line: >
    Funding is the return, not a cost. It is accounted per settlement per leg,
    reported as its own line in every table, and never blended into fees.
  funding_default_interval_hours: 8
  fx:
    symbol: EURUSDT
    foreign_currency: USDT
    rate: the reciprocal of the pair's daily close, dated by bar close
    conversion_bps: "10"
    charged: once in and once out
    note: >
      The pair trades on the venue itself, so the conversion is EUR to USDT directly
      and no USDT-equals-USD assumption is needed. Unchanged from SEXTANT-005.

# ---------------------------------------------------------------------------
# The eight variants
# ---------------------------------------------------------------------------
variants:
  fixed_for_every_variant:
    signal_instant: the rebalance instant R, 00:00 UTC on the first of the month
    signal_inputs: >
      funding settled at or before R; daily closes whose close_time is at or before R
    entry_price: each leg's last daily close that had finished forming at or before R
    exit_price: the same rule at the next rebalance
    rebalance_frequency: >
      monthly for the eight variants registered before amendment 6; quarterly for
      carry-rank90-10-quarterly. Carried per variant as rebalance_months, so the grid
      cannot hold a cadence the drift guard has not compared.
    sizing: equal capital across the selected pairs
    tie_handling: ranks descending, ties broken by base asset ascending, byte-wise
    insufficient_data: >
      any universe rule failing means the asset is not in the universe; counted and
      reported as not-evaluable, never silently dropped
    carrying_positions: >
      pairs carry across rebalances and folds; only the difference between held book
      and target book is traded, and only that difference pays cost
    trailing_funding_definition: >
      the SUM of every funding rate settled in the L days ending at R. A sum rather
      than a mean because it is the quantity actually received, and because a mean
      would need a divisor the varying settlement interval makes ambiguous.
    premium_definition: >
      the perpetual's premium-index daily close for the last bar closed at or before R
    turnover_days: 30
  registered:
    - id: carry-basket-5
      rebalance_months: 1
      signal: turnover
      positions: 5
      require_positive: false
      selection_rule: the 5 assets with the largest trailing 30-day median quote turnover
    - id: carry-basket-10
      rebalance_months: 1
      signal: turnover
      positions: 10
      require_positive: false
      selection_rule: the 10 assets with the largest trailing 30-day median quote turnover
    - id: carry-rank30-5
      rebalance_months: 1
      signal: funding_30
      positions: 5
      require_positive: false
      selection_rule: the 5 assets with the largest trailing_funding(A, R, 30)
    - id: carry-rank30-10
      rebalance_months: 1
      signal: funding_30
      positions: 10
      require_positive: false
      selection_rule: the 10 assets with the largest trailing_funding(A, R, 30)
    - id: carry-rank90-5
      rebalance_months: 1
      signal: funding_90
      positions: 5
      require_positive: false
      selection_rule: the 5 assets with the largest trailing_funding(A, R, 90)
    - id: carry-rank90-10
      rebalance_months: 1
      signal: funding_90
      positions: 10
      require_positive: false
      selection_rule: the 10 assets with the largest trailing_funding(A, R, 90)
    - id: carry-premium-10
      rebalance_months: 1
      signal: premium
      positions: 10
      require_positive: false
      selection_rule: the 10 assets with the largest premium(A, R)
    - id: carry-positive-10
      rebalance_months: 1
      signal: funding_30
      positions: 10
      require_positive: true
      selection_rule: >
        the assets with trailing_funding(A, R, 30) strictly greater than zero, the 10
        largest of them; if fewer than 10 qualify, hold only those and leave the rest
        in cash
    - id: carry-rank90-10-quarterly
      rebalance_months: 3
      signal: funding_90
      positions: 10
      require_positive: false
      selection_rule: >
        the 10 assets with the largest trailing_funding(A, R, 90), evaluated only at
        quarterly rebalance instants - 00:00 UTC on the first of January, April, July
        and October - and held unchanged in between. Every other choice in section 9.1
        is identical to carry-rank90-10.
      added_by: amendment-6
  why_a_ninth: >
    Cadence was a single point. At the execution venue one full-book round trip costs
    105.83 basis points of equity, so a single-digit carry pays for fewer than four
    round trips a year and the only survivable region is a slow one. The eight do span
    realised turnover, because pairs carry and only the difference trades, but they
    span it as a consequence of signal persistence rather than as a designed axis, and
    the slow end of that span holds only the two variants with no view of funding at
    all. This is the one point that is both slow and funding-aware. No churn was
    measured before it was registered: measuring the selection rules' turnover and then
    choosing the grid on the answer would be selecting the design on data.
  one_factor_comparison:
    pair: [carry-rank90-10, carry-rank90-10-quarterly]
    identical_in: [signal, lookback, positions, universe, cost cells, sizing, tie handling]
    differs_in: [rebalance_months]
    reported_as: >
      an explicit pair, so a reader is not left to notice that two rows differ in one
      field. Whatever separates their results is cadence, which is what the amendment
      exists to measure. Neither member may be altered, because a one-factor comparison
      is only one-factor if neither member is quietly re-specified.
  between_rebalances:
    applies_to: carry-rank90-10-quarterly
    sourced_delisting: >
      still forces an exit. Section 7's haircut rule applies to every variant on the
      same terms; cadence does not buy a pair the right to stay.
    left_the_carry_universe: >
      dropped from the target and never re-bought. Forced rather than chosen: keeping it
      would ask the engine to re-buy an instrument the point-in-time universe no longer
      admits, which is how a delisted name gets re-entered.
    freed_capital: >
      sits idle until the next rebalance instant. Section 9.1's denominator is the
      registered position count, so a pair leaving does not concentrate the others. The
      book between rebalances can only shrink, never grow.
    before_the_first_rebalance_instant: >
      nothing is held. 28.2 grants quarterly instants and no others, so a run whose
      first out-of-sample month is not one of them starts in cash rather than taking an
      unregistered rebalance. The affected months are reported beside the result.
  rebalance_count_reporting:
    applies_to: carry-rank90-10-quarterly
    requirement: >
      its rebalance count is printed beside its result EVERY time the result appears -
      every table, every JSON record, every sentence. Roughly 23 quarterly rebalances
      against roughly 70 monthly ones for its siblings on the same window, so its
      evidence is thinner by construction and a reader must see that where the number
      is rather than by looking it up.
  why_these_eight: >
    Three questions and no more. `basket` asks whether carry pays at all, with no
    selection. `rank30`, `rank90` and `premium` ask whether choosing which assets to
    carry adds anything, on three signals of the same underlying quantity. `positive`
    is the only variant whose exposure varies, which is why it is the one the timing
    null can bite on. There is no threshold sweep, no lookback ladder beyond two
    points and no weighting scheme other than equal: each would be a plausible thing
    to try and each would spend budget on a variant with no distinct hypothesis.

# ---------------------------------------------------------------------------
# Benchmarks, nulls and the decomposition
# ---------------------------------------------------------------------------
benchmarks:
  all_in_eur: true
  registered:
    - id: eur_cash
      definition: zero return, zero cost
    - id: btc_buy_and_hold
      definition: BTCUSDT spot held across the window in EUR, paying the same cost regime
    - id: equal_weight_passive
      definition: >
        the entire point-in-time carry universe held LONG SPOT ONLY, equally
        weighted. Deliberately the long-only benchmark: it is what the same capital
        would have done without the short leg.
    - id: random_selection_fully_invested
      definition: >
        N carry pairs drawn uniformly without replacement at every rebalance, always
        fully invested. The outer sanity check.
    - id: exposure_matched_selection_null
      per_variant: true
      definition: >
        draws uniformly without replacement exactly as many carry pairs as the
        variant held at that rebalance, leaving the same fraction idle. The variant's
        exposure path, none of its selection. This is the null that matters for this
        family.
    - id: timing_null
      per_variant: true
      definition: >
        holds the whole carry universe equally weighted, scaled to the variant's
        realised invested fraction. The variant's timing, none of its selection.

null_experiment:
  seed_counts:
    exposure_matched_per_cell: 500
    fully_invested_per_cell: 2000
  seed_start: 1
  seed_reduction_ladder: [500, 250, 100]
  reduction_direction: >
    down only, and the reduction is reported with the wall-clock projection that
    caused it. It is never stepped up.
  cells_running_nulls: [vip0_even, stress]
  nulls_are_trials: >
    Strategy-specific nulls are themselves trials and are counted in full in
    research/trial-registry.jsonl, which is what the Deflated Sharpe Ratio reads.
    They are not charged against the variant budget.

decomposition:
  per_variant_per_cell:
    - combined: the variant's own net return series
    - timing_effect: the timing null's series
    - selection_effect: the variant's own selected pairs, scaled to full investment
    - funding_contribution: >
        the sum of all funding received and paid, as a share of the combined net
        return, reported beside the basis contribution and the cost lines so a reader
        can see whether the return came from the funding stream, from basis
        convergence, or from something that should not have been there at all

# ---------------------------------------------------------------------------
# Success criteria
# ---------------------------------------------------------------------------
criteria:
  all_must_hold: true
  count: 6
  registered:
    - id: 1
      name: positive, and beats its own exposure-matched null
      test: >
        OOS annualised net Sharpe in EUR, vip0_even cell, STRICTLY GREATER than the
        95th percentile of that variant's own exposure-matched null in the same cell,
        AND OOS net return STRICTLY GREATER than zero.
      sign_condition_added: true
      sign_condition_reason: >
        SEXTANT-005 recorded that its criterion 1 misfired: in a cross-section where
        almost everything fell, a variant could clear "beats the 95th percentile of
        its own null" by losing less than chance lost, and two did, one while
        destroying 78.89 per cent of the account. Corrected here, in a
        pre-registration written before any number, and the correction makes the
        criterion stricter.
    - id: 2
      name: survives deflation
      test: DSR at least 0.95 at the full registry trial count, same cell
      threshold: "0.95"
    - id: 3
      name: the win is selection, not exposure
      test: >
        the selection effect's net return exceeds EUR cash AND accounts for at least
        50 per cent of the combined excess over EUR cash
      minimum_share: "0.50"
    - id: 4
      name: regime stability
      test: >
        positive OOS net return in at least 3 of the regimes carrying at least 6
        months each, and in no such regime a net return worse than
        equal_weight_passive over the same months
      minimum_regimes: 3
      minimum_months_per_regime: 6
    - id: 5
      name: sign stability across cost regimes
      test: net return keeps its sign across all four cells
    - id: 6
      name: the edge is not confined to the early window
      test: >
        the most recent 24 scored months, evaluated alone, satisfy criterion 1 in the
        headline cell
      added_by: amendment-1
  verdict_b_when: no variant satisfies criterion 1
  verdict_c_when: >
    at least one variant satisfies criterion 1 but not all six; or the resolved
    window carries fewer than 36 months; or N_eff falls below 24 for every variant
    that cleared criterion 1. (C) states precisely what is missing and what it would
    take to resolve it, and is never presented as a softened (A).
  no_criterion_is_looser_than_spike_005: true

# ---------------------------------------------------------------------------
# Decay: declared expectation D1 and the three statistics that test it
# ---------------------------------------------------------------------------
decay:
  declared_expectation:
    id: D1
    statement: >
      The mean monthly net return of the two most recent complete scored calendar
      years is LOWER than that of the two earliest complete scored calendar years,
      for the best variant in the headline cell.
    carries_verdict_weight: false
    why_declared: >
      Stated before the grid runs so that a decay narrative told after the fact can
      be checked against a prediction made before it. Funding carry has had capital
      pointed at it since roughly 2021, so an average across 2020 to 2026 may be
      dominated by an early period that no longer exists.
  per_calendar_year_table:
    reported_for: every variant, in the headline cell
    alongside_not_instead_of: the per-regime table
    columns:
      [
        scored months,
        net return,
        funding contribution,
        basis contribution,
        costs,
        annualised Sharpe with its standard error,
      ]
    minimum_months_for_a_year: 6
    under_populated_year: >
      A year with fewer than 6 scored months is reported with its return and an
      explicit statement that nothing can be concluded from it, exactly as an
      under-populated regime is. No Sharpe is computed for it.
  trend:
    method: ordinary-least-squares slope of monthly net return on months elapsed
    interval: 95 per cent bootstrap
    resamples: 10000
    seed: 987654321
    decay_is: a negative slope whose interval excludes zero
    not_decay: >
      A negative slope whose interval spans zero is not decay and will not be
      described as though it were.
  recent_window:
    months: 24
    test: criterion 1 of the criteria block, evaluated on those months alone
    null_source: >
      the SAME exposure-matched null draws, restricted to the same trailing months
      and percentiled over them. No new engine run and no new registry trial.
    multiplicity_paid_by: >
      requiring BOTH windows to clear rather than either, which is criterion 6. A
      second test on one result can only remove passes here, never add one.
    small_sample_declared: >
      24 months is a small sample and it is stated in advance. SEXTANT-004 measured a
      Sharpe standard error of 0.709 over 24 months. The window is reported with the
      effect size it could have detected at its own N_eff.
    two_distinct_findings_never_merged:
      rejects: >
        the point estimate is negative, or positive and below its own null's 95th
        percentile by more than the sample could plausibly be wrong about
      cannot_resolve: >
        the point estimate is positive and below its null by less than the detectable
        effect size. This is (C) for the persistence question specifically, and it is
        reported in those words.
    standard_error_correction: >
      Mertens skewness and kurtosis correction, because SEXTANT-005 measured skewness
      2.46 and kurtosis 10.36 on this asset class. An uncorrected standard error would
      make the bar for calling a rejection LOWER on exactly the distributions where a
      Sharpe estimate is least trustworthy.
  outcomes:
    persisting_edge: criteria 1 to 5 and criterion 6 all clear
    decayed_edge: >
      criteria 1 to 5 clear and criterion 6 fails with a REJECTING recent window.
      Reported in those words with both windows' numbers, and it is NOT verdict (A).
      An edge that existed until 2023 and does not exist now cannot justify building a
      system to trade it in 2026.
    undetermined_persistence: >
      criteria 1 to 5 clear and criterion 6 fails with an UNRESOLVED recent window.
      Verdict (C), stated as: the full window shows an edge, the recent window is too
      short to say whether it survives, and here is the N_eff that would settle it.

# ---------------------------------------------------------------------------
# Leverage, stage 3, and the maintenance margin that is an assumption
# ---------------------------------------------------------------------------
leverage:
  runs_only_if: F1 clears criterion 1 at 1x
  never: >
    Leverage is never a way to turn a losing family into a winning one. If F1 does
    not clear criterion 1 at 1x, none of this is run and none of it is reported.
  spot_leg_sweep: not run
  spot_leg_sweep_reason: >
    Levering a cash-and-carry means borrowing to buy more spot, at a margin-lending
    rate this venue does not publish historically. A sweep over an invented number is
    not a sweep, so it is not run, and that is reported as a limitation of the family
    rather than hidden.
  margin_buffer_sweep: ["0.50", "0.20", "0.10", "0.05"]
  margin_buffer_note: >
    The futures leg's initial margin fraction: two, five, ten and twenty times
    leverage on that leg alone. Approved as the better parameterisation of stage 3
    for this family, and not as a second-best substitute for a sweep that cannot be
    run. Return, drawdown, Sharpe, Sortino, capital
    utilisation and sensitivity to fees, funding and slippage at each.
  probability_of_ruin_from: >
    the empirical distribution of the pair's own daily basis moves. NOT a normal
    approximation: SEXTANT-005 measured skewness 2.46 and kurtosis 10.36, where a
    Gaussian assumption understates the tail by a wide margin precisely where it
    matters.
  at_1x_there_is_no_liquidation_price: >
    A fully-collateralised carry pair at 1x has no liquidation price at all, so no
    edge finding in this family depends on the maintenance margin.

maintenance_margin:
  status: assumption, not a datum
  point_in_time_available: false
  what_the_venue_publishes:
    fapi_v1_leverageBracket: >
      not public. HTTP 401, API-key format invalid, without a credential. Even the
      current schedule is not readable anonymously.
    fapi_v1_exchangeInfo: >
      public, carries NO margin brackets, and lists only currently-trading contracts.
    web_cms_brackets_endpoint: rejected a bare request, illegal parameter
    data_archive: no brackets family exists at any grain
  archived_copy_search:
    attempted: true
    snapshot: >
      https://web.archive.org/web/20211223052201/https://www.binance.com/en/futures/trading-rules/perpetual/leverage-margin
    snapshot_date: 2021-12-23
    result: >
      not established. The page is client-rendered: the snapshot holds the page shell
      and its translation strings, and the bracket table came from a request the
      archive did not capture. No maintMarginRatio, maintenanceMarginRate or
      equivalent field appears anywhere in the archived HTML. Recorded so nobody has
      to rediscover where the trail goes cold.
    timeboxed: >
      The Sponsor's instruction was to use an archived copy if cheaply findable and
      not to chase it otherwise. It was not cheaply findable and was not chased.
  bracket_assignment_does_not_arise:
    largest_single_leg_notional_eur: "1428.57"
    arithmetic: "1500 / (1 * (1 + 0.05))"
    approximately_usdt: "1550"
    todays_first_bracket_ceiling_usdt_btcusdt: "50000"
    ratio: about thirty-two times below the first bracket's ceiling
    consequence: >
      Every position in every variant, in every cell, at every margin-buffer setting,
      sits in the first bracket and is nowhere near leaving it. Bracket assignment is
      the size-dependent and genuinely hard part of a historical margin
      reconstruction, and at this capital it does not arise. The only open question is
      what the FIRST-BRACKET RATE was historically, which is a single number per era
      rather than a schedule.
  settings:
    - rate: "0.005"
      status: headline
      basis: today's published first-bracket rate for majors
      caveat: an assumption and a look-ahead, applied to 2020 data
    - rate: "0.010"
      status: companion
      basis: twice the headline, for the possibility that the rate was higher earlier
      caveat: also an assumption; nothing measured supports or contradicts it
    - rate: "0.025"
      status: stress
      basis: five times today's published rate
      caveat: >
        A STRESS LEVEL, NOT A CANDIDATE RATE at this capital. A variant that fails
        only at 0.025 is NOT rejected on that basis, and the report says so where the
        number appears.
  bias_direction: >
    Optimistic. The first-bracket rate may have been higher in 2020 than it is now,
    which would make liquidation more frequent and probability of ruin higher than
    reported. The 0.010 companion shows how much that could matter.
  relaxation_recorded: >
    Section 16.3 originally required a leverage conclusion to hold at 0.025. That
    sentence was wrong and 17.2 corrected it, before any result existed, on the
    arithmetic above rather than on anything observed. It touches only how a leverage
    and probability-of-ruin conclusion is phrased. Criteria 1 to 6 are untouched.

# ---------------------------------------------------------------------------
# The contraction check: composition, not size (amendment 26.1)
# ---------------------------------------------------------------------------
#
# The registered funding-evaluability rule disqualifies 231 of 339 pairs at one
# rebalance, because the venue did not publish one settlement instant. Section 21
# argued that the rule can only shrink the opportunity set, which is true of SIZE
# and does not carry to COMPOSITION: a rule that removes two thirds of a universe
# non-randomly changes what the universe is, and the direction of that bias is not
# knowable from the count.
contraction_check:
  runs_at: >
    The rebalance with the largest month-on-month contraction in pair count,
    identified by computation rather than named here, so the procedure survives a
    different dataset.
  groups: [admitted, excluded by funding_evaluability]
  attributes:
    - name: median_funding_rate
      statistic: >
        the median of every rate the venue published for that perpetual in the
        trailing 30 days
      why_a_median_not_a_sum: >
        The excluded group's trailing SUM is incomplete by construction, so comparing
        it against complete sums would measure the hole rather than the population.
    - name: contract_age_days
      statistic: >
        days from the perpetual's earliest sourced listing instant to the rebalance
    - name: liquidity_band
      statistic: >
        the band the cost model would charge, from trailing median quote turnover,
        reported as a count and a share per band; the tested difference is the deep
        share
  difference_method: bootstrap
  resamples: 10000
  seed: 987654321
  systematic_when: >
    The 95 per cent interval on the difference excludes zero. An interval that spans
    zero is not systematic and will not be described as though it were, the same rule
    16.1 applies to the trend slope.
  headline_reported_twice:
    full: the whole scored series, as registered
    ex_contraction: the same series with the affected rebalance's month removed
  recent_window_ex_contraction: >
    The 24 most recent scored months EXCLUDING the affected one, reaching one month
    further back so both versions carry 24 observations. Holding n equal means a
    difference between the two answers is attributable to the month rather than to
    sample size. Null draws are restricted to the same months in both cases.
  criterion_6_is_judged_on: >
    the full series, exactly as registered. The ex-contraction figure sits beside it
    as a robustness note and decides nothing.
  if_they_disagree: >
    The persistence section's opening sentence says so: the answer to whether this
    edge persists depends on a single month whose universe was determined by a hole
    in the venue's published data. Reporting whichever answer was preferred, without
    saying the two differ, would not be reporting.
  the_rule_itself_is_unchanged: >
    Section 6 rule 4 stands exactly as written. This block adds a description and a
    second reading of one headline. It changes no criterion.

# ---------------------------------------------------------------------------
# The execution-venue sensitivity (amendment 26.2)
# ---------------------------------------------------------------------------
#
# Every grid cell charges the research venue's rates. The only venue this account can
# trade is the execution venue, whose SPOT schedule is four to eight times higher on
# the long leg of every carry pair. A positive research finding that arrives without
# this number is a finding whose practical value is unstated.
execution_sensitivity:
  label: kraken_execution
  looked_up_not_assumed: >
    Both legs read from the execution venue's own published fee schedule page on
    2026-09-10, because the brief required a lookup rather than an assumption.
  spot_maker_bps: "40"
  spot_taker_bps: "80"
  futures_maker_bps: "2"
  futures_taker_bps: "5"
  maker_fraction: "0.50"
  spread_and_slippage: unchanged from section 8, charged on both legs
  the_finding_from_the_lookup: >
    The PERPETUAL leg is the same price at both venues, 2 and 5 basis points. That was
    not the expected answer. The entire cost differential sits on the SPOT leg: 40/80
    against 10/10, four times on maker and eight on taker.
  tier_question_does_not_arise: >
    The execution venue's tier is the most favourable of spot volume, futures volume
    and assets on platform. At 1,500 EUR the account is in the entry tier on all
    three, so no bracket question arises - the same arithmetic that closed the
    margin-bracket question in 17.2.
  round_trip_fee_arithmetic:
    research_venue_bps: "27"
    execution_venue_bps: "127"
    basis: >
      Two legs opened and two closed at the headline 50/50 mix: 2 * (10.0 + 3.5)
      against 2 * (60.0 + 3.5). Fees only, before spread and slippage. What it costs a
      variant depends on realised turnover, which the run measures rather than
      assumes.
  applies_to: >
    The single variant with the highest out-of-sample annualised net Sharpe in the
    headline cell, ties broken by variant identifier ascending. It runs whether or not
    that variant cleared anything.
  is_a_grid_cell: false
  consumes_variant_budget: false
  budget_reasoning: >
    The execution venue's rates are higher on one leg and identical on the other, so
    this re-cost can only make a variant look WORSE. It cannot produce a winner that
    was not already one, so it cannot widen the search, which is the only thing the
    budget exists to prevent.
  recorded_in_the_registry: true
  registry_reasoning: >
    Counted in full, so it enters the Deflated Sharpe Ratio's trial count, where its
    only possible effect is to raise the bar.
  read_by_any_criterion: false
  labelling: >
    Never in the same table as a research-venue number without the venue in the same
    row. An execution-venue fee applied to a research-venue universe is a
    hypothetical, and adjacency to a measurement is itself a claim - the same rule C2
    states for capacity.
  what_it_is_not:
    - >
      NOT evidence that this strategy is executable at the execution venue. It
      substitutes a fee schedule and changes nothing else: the universe, the funding
      stream and the prices are all still the research venue's.
    - >
      A LOWER BOUND on the difficulty, not an estimate of it. The execution venue
      lists far fewer perpetuals, so its real carry universe is narrower than the one
      this number is computed on, which means fewer pairs and a smaller opportunity
      set. Whether it lists a perpetual for each base at each rebalance is a separate
      point-in-time question this task does not answer.
    - >
      SILENT on whether the account may trade perpetual futures at the execution venue
      at all. That is a jurisdiction and product-availability question, outside this
      task's scope, and docs/LIVE-GATES.md is unaffected.
  the_sentence_this_makes_possible: >
    If the carry clears its criteria at research rates and loses money at execution
    rates, the report says exactly that, in the verdict, in those words. It would mean
    the edge is real and this account cannot harvest it, which is a different answer
    from both (A) and (B) and must not be presented as either.

# ---------------------------------------------------------------------------
# Break-even turnover, and declared expectation D2 (amendment 27)
# ---------------------------------------------------------------------------
#
# A reframing of the execution-venue re-cost above, not new work. A pass-or-fail
# verdict compresses the quantity that actually binds into a word and is useless the
# moment a fee schedule changes. A break-even turnover carries the fee level in its
# denominator, so a reader with different fees divides again rather than asking for
# another backtest.
break_even:
  unit: round trips per year, where a round trip is the WHOLE BOOK
  why_the_whole_book: >
    It is the unit the fee arithmetic already uses, and a per-pair figure would depend
    on the position count, which differs between variants.
  fee_basis: basis points of equity, so numerator and denominator share units
  fee_of_equity_formula: "round_trip_fee_bps / (1 + margin_fraction)"
  research_fee_of_equity_bps: "22.50"
  execution_fee_of_equity_bps: "105.8333333333333333333333333"
  numerator: >
    The best variant's out-of-sample GROSS return - before fees, spread, slippage and
    conversion - compounded to an annual rate in basis points of equity. Reported as
    its own number so both break-evens can be recomputed at any fee level without
    rerunning anything. That is the point of the reframing.
  three_numbers:
    - name: break_even_at_research_fees
      formula: "gross_return_bps_per_year / 22.50"
    - name: break_even_at_execution_fees
      formula: "gross_return_bps_per_year / 105.8333333333333333333333333"
    - name: realised_turnover
      formula: "fees_charged_bps_of_equity_per_year / 22.50"
      measured_from: >
        the fee line the engine actually charged in the headline cell, inverting the
        same arithmetic rather than reconstructing traded notional. The three numbers
        are then definitionally consistent: if realised exceeds the research
        break-even, the gross carry did not cover its own fees and the net return is
        negative. No separate turnover estimator can disagree with the fee line,
        because it IS the fee line.
  conversion_leg_excluded: >
    Charged twice for the whole run rather than per rebalance, so folding it into a
    per-round-trip figure would misattribute a fixed cost to turnover.
  spread_and_slippage_excluded: >
    They are assumptions rather than published rates, they are identical at both
    venues, and they also scale with turnover. The fee break-even is therefore an
    UPPER BOUND on allowable turnover and not an estimate of it: the break-even on
    total cost is strictly lower. The report says so where the numbers appear.
  consistency_check: >
    The re-cost's own measured fee line must equal realised_turnover times 105.83 basis
    points of equity per year, to rounding. The two are computed by different routes,
    one from a run and one from arithmetic, and a disagreement means one of them is
    wrong. Reported as a matched pair, never as one number.
  declared_expectation:
    id: D2
    statement: >
      The binding constraint on this family is holding period, not signal quality.
    carries_verdict_weight: false
    clauses:
      - id: D2a
        statement: >
          If any variant clears criteria 1 to 6 in the headline cell, it is a
          low-turnover one: its realised round trips per year is at or below the median
          of the eight variants' realised turnover.
        refuted_when: a clearing variant sits strictly above that median
        unresolved_when: >
          no variant clears, in which case D2a cannot be evaluated and is reported in
          those words rather than quietly dropped
      - id: D2b
        statement: >
          The best variant's break-even turnover at execution fees is fewer than 12
          round trips per year, so a full monthly rebalance would not pay for itself at
          execution fees.
        threshold: 12
        refuted_when: >
          it is 12 or more, which would mean the execution-fee gap does not bind at the
          rebalance frequency this family actually trades
    what_would_refute_all_of_d2: >
      A variant whose gross carry is large enough that 127 basis points a round trip
      still leaves it profitable at monthly turnover. That would mean signal quality
      rather than holding period was binding, and it would make this amendment's
      framing wrong. It is a real possibility and it is why D2 is written down.
  is_a_criterion: false
  consumes_variant_budget: false
  amends: >
    26.2's closing promise of a survives-or-dies sentence. That sentence is now the
    conclusion of a break-even statement rather than the whole of it, and where the two
    break-evens straddle realised turnover the report gives the numbers rather than the
    word. The rest of 26.2 stands unedited.

# ---------------------------------------------------------------------------
# Capacity: measured only inside the depth window
# ---------------------------------------------------------------------------
capacity:
  depth_window:
    starts: 2023-01-01
    ends: 2024-05-17
    months: 17
  evaluation_window_spans: roughly 2020 to 2026
  the_collision: >
    Declared expectation D1 predicts the edge is concentrated early. If D1 holds,
    the period where the edge most likely lives is precisely the period where
    capacity cannot be measured. Those two facts are not independent, and a report
    that put a depth-measured capacity figure next to a headline return earned mostly
    in 2021 would be implying a measurement nobody made.
  rules:
    - id: C1
      rule: >
        Every depth-derived capacity figure carries the window it was measured over,
        in the same cell, in the same row. No capacity figure in this report omits its
        window.
    - id: C2
      rule: >
        A capacity number for any period outside the depth window is an extrapolation.
        It appears in its own table, under its own heading, labelled as an
        extrapolation, with the assumption that carried it outside the window stated.
        It is never in the same table as a measured value and never in an adjacent
        column, because adjacency is itself a claim.
    - id: C3
      rule: >
        When the edge sits outside the window, capacity is reported as UNESTABLISHED,
        in those words. Decided by the table below, from series that already exist.
      minimum_depth_months: 12
      decision_table:
        - condition: depth_months < 12
          report: >
            capacity unestablished. The depth window does not contain enough of this
            variant's scored months to measure it.
        - condition: mean_inside <= 0
          report: >
            capacity unestablished. The variant did not earn over the months where
            depth can be measured, so there is no edge there whose capacity could be
            reported.
        - condition: mean_inside > 0 and mean_outside > mean_inside
          report: >
            capacity reported as measured over a period in which this variant earned
            less than it did overall, and that sentence appears beside the number.
        - condition: mean_inside > 0 and mean_outside <= mean_inside
          report: capacity reported as measured, with its window, under rule C1
      unestablished_is_a_real_answer: >
        It does not mean the strategy has no capacity. It means this dataset cannot
        say what it is, which is the same class of statement as invariant 9's not
        evaluable, and it is not softened.
  turnover_capacity:
    reported_for: the whole window
    basis: daily quote turnover, in every kline row for every month
    kept_separate: >
      A different quantity from resting depth, labelled as an inference from traded
      notional rather than from a book, and kept out of the depth table by rule C2.

# ---------------------------------------------------------------------------
# The two rule-fixed measurements, neither of which is a trial
# ---------------------------------------------------------------------------
spread_sample:
  tree: bookTicker
  available: 2023-05-16 to 2024-03-30
  size_per_symbol_day: 50 to 90 MB
  days:
    [2023-05-16, 2023-06-01, 2023-08-01, 2023-10-01, 2023-12-01, 2024-02-01]
  symbols:
    count: 6
    rule: >
      two perpetuals per liquidity band, chosen by the same trailing 30-day median
      quote turnover the cost model's bands are cut on, evaluated at 2023-05-15: the
      two highest-turnover members of the carry universe at that instant, the two
      nearest its median, and the two nearest its 10th percentile. Ties broken by
      symbol ascending.
    evaluated_at: 2023-05-15
  statistic: >
    per symbol-day, the time-weighted mean and the median of (ask - bid) / midpoint
    in basis points, and the same two restricted to 00:00-00:05 UTC
  is_a_trial: false
  acquisition:
    rule_id: S1
    added_by: amendment-8
    generalised_by: amendment-9
    supersedes_condition: >
      amendment 8's condition was "some variant earns a positive net return at research
      fees". It is superseded by the condition below, which asks a different question
      and gives a different answer on F1: amendment 8's was false and amendment 9's is
      true. Both are recorded rather than one overwriting the other.
    decided_by: >
      a computed condition on research/spike-006-f1.json, in exactly the way rule C3
      decides whether the depth sample is needed. Nobody chooses after a number exists.
    condition: >
      with the assumed cost set to ZERO and the run re-evaluated, at least one
      registered variant reaches a net return AND a Sharpe that would themselves clear
      criterion 1: strictly positive net return over the scored window, and an
      annualised Sharpe above the 95th percentile of that variant's own
      exposure-matched null.
    why_not_a_sign_change: >
      A variant that crosses zero and lands at a figure too small to clear its own null
      was not rescued by the assumption, it was rescued by rounding. Measuring the
      assumption would change nothing about the verdict, and acquiring data to refine a
      cost on such a variant is acquiring data no rule reads.
    counterfactual_model: >
      The removed cost is added back in equal instalments across the scored months,
      each converted to a return on that month's opening equity along the realised
      path. Exact in the total and in the sign of the net return; approximate in the
      volatility, since the true charge follows each month's turnover. From the first
      family whose runner records per-month assumed costs, the test is computed
      exactly and the model is retired.
    per_month_assumed_costs_required_from: F2
    floor_from: F2
    floor: >
      FROM F2, the counterfactual must clear the null's 95th percentile by at least one
      standard error of its own Sharpe estimate, computed with the skewness and
      kurtosis correction rather than the normal approximation. Stated as a principle -
      the estimate's own uncertainty - rather than as a euro figure chosen after seeing
      which euro figures were in play.
    floor_intent: >
      An assumption is worth measuring when removing it could produce a result
      DISTINGUISHABLE FROM NOISE, not merely one with a different sign.
    floor_does_not_apply_to_f1: >
      F1 is judged by the bar registered when it ran. Applying a bar retrospectively is
      the move amendment 9's own defect was an instance of, in the other direction.
    floor_measured_against_f1: >
      Recorded for information, since F1's figures exist: the floor would NOT have
      changed F1's answer. Both clearing variants sit far above the null plus one
      standard error, because the null's 95th percentile is itself at -1.26 to -1.58
      and a standard error is about 0.48. A floor stated relative to a deeply negative
      null is not a floor in absolute terms. Whether the bar the intent describes is
      this one, or one stated relative to ZERO - which on F1 would have left the rule
      unfired - is open and is the Product Owner's to settle before F2 runs.
    floor_anchor: zero
    floor_anchored_by: amendment-11
    floor_as_settled: >
      SETTLED by amendment 11, and this is the bar that applies FROM F2. Rule S1 fires
      when some variant, with its assumed cost set to ZERO, has an annualised Sharpe
      exceeding ZERO by at least one standard error of its own estimate, skewness- and
      kurtosis-corrected, AND exceeding the 95th percentile of its own exposure-matched
      null. BOTH clauses, never either.
    floor_why_zero_and_not_the_null: >
      The exposure-matched null over this window is itself losing: its 95th percentile
      sits at -1.26 to -1.58. A bar anchored to it is a bar below zero, and a variant
      that merely fails to lose clears it. That is not what the intent said, which was
      that removing an assumption must be able to produce a result distinguishable from
      NOISE.
    floor_supersedes: >
      amendment 10's null-anchored floor, which was registered as applying from F2 and
      was never applied to an F1 figure. Both are retained rather than one overwriting
      the other: amendment 10 states the bar as first written and this states the bar
      that applies. On F1's figures the null-anchored form would have fired and the
      zero-anchored form would not, and neither was substituted for the other after the
      fact.
    floor_measured_against_f1_at_the_zero_anchor: >
      Recorded because the figures exist and for no other purpose: 0.091 against a
      standard error of 0.484, and 0.097 against 0.472. Neither clears zero by its own
      standard error, so the zero-anchored floor would have left rule S1 unfired on F1.
      F1's acquisition stands, and it stands for the right reason: the rule as written
      at the instant the sample was acquired fired, and it was honoured.
    quantity: net return over the scored out-of-sample window, after every cost line
    threshold: "0"
    comparison: strictly greater than
    variants_considered: all nine registered variants
    cells_considered: >
      the four registered cells, every one of which prices the research venue's
      published schedule. The maker, even and taker cells differ only in fill mix and
      the stress cell only in its spread and slippage multiplier.
    cells_excluded: [kraken_execution]
    cells_excluded_because: >
      the execution-venue sensitivity cell is a different fee schedule, and rule S1 is
      a condition at research fees.
    acquire_if_true: true
    acquire_if_false: false
    why_this_condition: >
      Spread is an assumed cost, not a measurement, and the measurement can only ever
      make a variant look worse. If every variant's gross carry is cancelled by its
      basis risk and its fees, no spread measurement changes the verdict, and 1.8 to
      3.2 GB would be acquired to refine a cost on a strategy that does not earn. If a
      variant does show positive net return, spread is precisely the cost that could
      kill it and the measurement becomes decisive. The same sequencing as rule C3, for
      the same reason.
    size_if_acquired:
      symbol_days: 36
      megabytes: 1800 to 3200
    subsampling: >
      none. The six symbols and six days are already fixed by the rule above, and a
      subsample of an already rule-fixed sample would be a second rule chosen with
      nothing to constrain it. The registered sample IS the minimum.
    not_acquiring_is_reported: >
      when the condition is false the report states that the spread sample was not
      acquired, states rule S1 and the figures that decided it, and the cost assumption
      continues to be labelled an assumption under invariant 12. An unmeasured spread
      is never reported as a measured one, in either direction.
    is_a_trial: false
  changes_no_result: >
    It measures the QUOTED spread on the perpetual leg, on six days, in one
    eleven-month stretch of a longer window. It says nothing about the spot leg,
    about slippage, about the other 2,000-odd days, or about what a 150 EUR order
    would have paid. It sits BESIDE the configured assumption and every variant
    remains costed at the assumption. Invariant 12 is not weakened by measuring
    something; it would be weakened by reporting the measurement as the cost model.

depth_sample:
  tree: bookDepth
  grain: daily
  available: 2023-01-01 to 2024-05-17
  size_per_symbol_day_mb: "0.47"
  days:
    rule: the first trading day of each calendar month in the available range
    count: 17
    first: 2023-01-01
    last: 2024-05-01
  symbols:
    count: 20
    rule: >
      the perpetual legs of the twenty carry-universe members with the largest
      trailing 30-day median quote turnover at 2022-12-31, ties broken by symbol
      ascending
    evaluated_at: 2022-12-31
  statistic: >
    per symbol-day, the median across the day's minutes of cumulative resting
    notional within 1 per cent of mid, and the same within 5 per cent; plus both
    restricted to 00:00-00:05 UTC
  is_a_trial: false
  what_it_cannot_say: >
    It measures resting depth on the PERPETUAL leg only, on seventeen days, in a
    seventeen-month stretch of a longer window. Nothing about the spot leg, nothing
    about the other years, nothing about what would actually have filled. Capacity is
    reported as a bound with its basis stated, constrained by rules C1, C2 and C3.


# ---------------------------------------------------------------------------
# What every family reports, whatever its signal (amendment 31)
# ---------------------------------------------------------------------------
every_family_reports:
  currency_leg_as_its_own_line:
    rule: >
      The FX conversion charge is reported as its own line in every cost table, in
      every family, and is NEVER folded into fees.
    why: >
      Measured in F1: the conversion leg was 20.3 per cent of the best variant's toll
      against 13.7 per cent in exchange fees. A euro-funded account trading USDT-quoted
      instruments pays a currency toll larger than the venue's own, it scales with
      turnover rather than sitting fixed per run, and it lands identically on any
      family quoted away from the account's currency. Folding it into fees would hide
      the larger of the two and would misattribute a structural cost of this account to
      the venue's schedule.
  measured_spread_is_the_default_from_f2:
    rule: >
      The spread measured under rule S1 becomes the DEFAULT spread cost from F2 onward,
      per liquidity band, and the registered assumption is retained beside it as a
      labelled alternative. Every F2+ result states which of the two it was computed
      at.
    why: >
      The assumed spread is 41.2 per cent of F1's toll and four families have still to
      run on it. It is the largest single line in the cost model and it was a guess.
      Measuring it once replaces the guess for every family that follows: if the
      measurement is close to the assumption every later result is stronger for it, and
      if it is far off that is learned before four more families run on a wrong number
      rather than after.
    invariant_12_still_holds: >
      A measured spread is reported as a measurement and the assumption as an
      assumption, and a family costed at the measured value says so in every table. The
      band the sample did not reach keeps the assumption, labelled as one.
    does_not_apply_to_f1: >
      F1 remains costed at the assumption in every cell. The measurement is printed
      beside it and is never substituted into a computed F1 figure.
  family_level_result_is_the_headline:
    rule: >
      The headline figure for a family is the result ACROSS its grid, not its best
      variant's. A best-variant figure is reported beside it and never in front of it.
    why: >
      Measured in F1: the best variant cleared 227.53 of carry before charges while the
      nine together cleared 18.86, because the price legs returned 2,094.76 of the
      2,113.62 received in funding. The family-level number is the finding - the
      premium is compensation for the basis risk that earns it, priced close to exactly
      - and a best-variant headline would have reported the opposite impression from
      the same run.

# ---------------------------------------------------------------------------
# Statistics
# ---------------------------------------------------------------------------
spread_levels:
  rule_id: A12.1
  added_by: amendment-12
  applies_from: F2
  is_a_trial: false
  headline:
    deep_bps: "10"
    what_it_is: >
      The registered ASSUMPTION, and an upper bound rather than an estimate. This is the
      number every success criterion is evaluated against: every verdict letter, every
      Deflated Sharpe Ratio and every criterion comparison uses it and only it.
    label_required_everywhere: >
      registered UPPER BOUND, approximately 18.87 times the measured deep-band
      half-spread. NEVER an estimate, a conservative estimate or a calibration. A
      downstream reader must not be able to mistake it for something that was measured.
  bound:
    deep_bps: "0.53"
    what_it_is: >
      The measured median quoted half-spread in the deep band, from the 36 symbol-days
      of rule S1's sample. Reported as a LOWER BOUND on cost and never as a criterion.
      Mid and thin bands take whatever rule M1 establishes.
    never_a_criterion: >
      No criterion, no verdict letter and no Deflated Sharpe Ratio reads the bound. It
      is a reported sensitivity.
  both_or_neither: >
    No table may show one level without the other, for every family from F2 onward.
  why_not_simply_reverting_to_the_bound: >
    The measurement is not point-in-time: six symbols, six days, deep band only, inside
    one eleven-month stretch of a five-year window. Projecting a measured present-day
    quoted spread backwards across the whole evaluation window is the same class of
    error as the estimator rule E1 rejected, in the flattering direction. This project
    does not get to make that error in the direction it would prefer.
  f1_needs_no_rerun: >
    F1 already carries the zero-spread, zero-slippage counterfactual in section 7.2 and
    7.4, which bounds the question more strongly than the measured level does. The zero
    case is reported and no F1 rerun is required.

spread_contingent_verdict:
  rule_id: A12.2
  added_by: amendment-12
  applies_from: F2
  is_a_trial: false
  outcome: spread-contingent
  definition: >
    A family that FAILS its criteria at the headline and CLEARS them at the bound is
    recorded as spread-contingent. It is not closed as a failure and it is not
    promoted. Its verdict is deferred and rule H1 fires.
  fails_at_both: closed normally
  clears_at_both: >
    a pass on the headline, unaffected by this rule. The bound adds nothing to a family
    that already clears the number the criteria are evaluated against.
  what_it_prevents: >
    It stops a number this project invented from being the conclusion, and it stops it
    in BOTH directions: the assumption can no longer manufacture a failure, and the
    measurement can no longer manufacture a success.
  registered_before_any_family_could_produce_it: >
    Registered now precisely so it cannot be invented after seeing a number. No family
    has yet been recorded spread-contingent; F1 cannot be, because it fails at the
    headline, at the bound and at zero.

band_recut:
  rule_id: B1
  added_by: amendment-12
  is_a_trial: false
  why: >
    The measurement established that spread varies by two orders of magnitude INSIDE one
    band, because the bands are cut on quote turnover and turnover is not what
    determines spread. A band whose members do not share a spread is not a band, it is
    an average with a label.
  procedure: >
    For every candidate quantity below, compute Spearman's rank correlation against the
    measured median quoted half-spread across every sampled symbol, and its two-sided
    permutation p-value from 10000 permutations at seed 20260911. The cut quantity is
    the candidate with the largest absolute rank correlation among those whose p-value
    is below 0.05. If no candidate clears it, the bands are not re-cut on any of them
    and that is reported.
  candidates:
    - trailing 30-day median quote turnover, which is the quantity the bands are
      currently cut on
    - relative tick size, the venue's price increment over the price, derived from the
      greatest common divisor of the stored price text
    - realised daily volatility over the trailing 30 days
    - the mean daily trade count over the trailing 30 days
  how_many_bands: >
    Try three bands, then two, then one, and adopt the LARGEST number for which every
    band holds at least 3 sampled symbols and adjacent bands' measured median
    half-spreads differ by at least a factor of 2. Do not keep three bands because there
    are currently three. If the evidence supports one band, collapse to one and say so.
  collapse_is_an_allowed_answer: >
    One band is a legitimate outcome and is better than three bands that do not
    separate. A partition that does not partition is worse than no partition, because it
    carries the authority of a structure it does not have.
  changes_no_f1_figure: >
    F1 ran and was judged on the turnover-cut bands and is not re-scored on re-cut ones.
    The re-cut applies from F2.

extended_spread_sample:
  rule_id: M1
  added_by: amendment-12
  is_a_trial: false
  why: >
    All six symbols in rule S1's sample fall in the DEEP band, so the mid and thin band
    defaults are pure extrapolation from a band they are not in.
  requirement: >
    At least 4 symbols in each of the mid and thin bands, over the same protocol as rule
    S1 - whole-day and 00:00-00:05 UTC time-weighted quoted spread from the venue's
    bookTicker archive - and over at least the same 6 days.
  occupancy_is_computed_first: >
    Band membership is decided by the cost model's own floors at every rebalance instant
    of the F1 window, from data already held, BEFORE anything is downloaded. A band that
    no member of the traded universe ever occupies needs no measurement.
  an_empty_band_is_the_answer: >
    If the traded universe contains no symbols in a band, record that the band is EMPTY
    IN PRACTICE and that its default is therefore unused. That is a better answer than a
    measured number for instruments the strategy would never touch, and it is reported
    as a finding rather than as a gap.
  dispersion_is_the_finding: >
    Report the full per-symbol table. Do not average away the dispersion.
  selection:
    gap_in_amendment_12: >
      A12.4 states how many symbols and how many days and does not state the instant the
      symbols are ranked at. Rule S1's instant cannot simply be reused: at 2023-05-15
      every member of the carry universe cleared the deep band's floor, so the mid and
      thin bands were empty at exactly the moment rule S1 selected. The rule below is
      registered to close that gap and is committed before any symbol is selected.
    instant: >
      For each band independently, the earliest rebalance instant at or after rule S1's
      own 2023-05-15 at which that band holds at least the required number of members.
      Earliest rather than best: it is the instant nearest the one rule S1 used, and it
      is fixed by the data rather than chosen from it.
    which_members: >
      The members nearest that band's median trailing 30-day quote turnover at that
      instant, ties broken by symbol ascending, which is rule S1's own tie-break.
    days: >
      Rule S1's own six days, unchanged. The same days make the two samples comparable,
      and a different set would make every difference between the bands ambiguous
      between the band and the calendar.
    an_unpublished_symbol_day: >
      reported as unpublished and never replaced by another symbol or another day.
      Substituting for a gap is how a sample stops being the sample that was registered.
    a_symbol_may_leave_its_band_later: >
      expected, and not corrected for. A band is a property of an instrument at an
      instant, and an instrument selected into the mid band in 2023 may be deep or
      delisted by 2024. The measurement says what the spread was on the registered days
      for instruments that occupied the band at the registered instant, which is what a
      cost model needs, and the per-symbol table shows the dispersion rather than hiding
      it in an average.
  time_box: one working day

historical_quoted_spread:
  rule_id: H1
  added_by: amendment-12
  is_a_trial: false
  fires_only_if: >
    rule A12.2 records a spread-contingent family. This work is NOT done
    speculatively.
  why_not_another_inference: >
    Rule E1 failed because it inferred spread from daily OHLC, and that inference has no
    chance when the spread-to-volatility ratio sits four orders of magnitude below where
    those estimators were validated. The correct response to a failed inference is not a
    better inference. It is to check whether the quantity was published.
  establish_in_stage_0_style:
    - whether the venue's public archive publishes historical best bid and ask - the
      bookTicker tree and its relatives - for the symbols and the window the contingent
      family uses
    - the window actually covered per symbol, from file presence and never inferred
    - >
      the size and acquisition cost of a SAMPLED subset rather than the whole tree.
      Sampling at the decision timestamps is sufficient, because the model needs the
      spread at the instants the strategy trades and not a continuous series.
  if_it_exists: >
    Build a point-in-time per-symbol, per-period quoted half-spread table from the
    archive, register it as a MEASURED input with its own checksums, and rerun the
    contingent family against it. That result supersedes both the headline and the bound
    for that family, because it is measurement rather than assumption.
  if_it_does_not_exist_for_the_window: >
    Report the family as UNDETERMINED with the missing datum named precisely, and state
    which way the omission biases it. Do not substitute.
  time_box: three working days
  sponsor_action: >
    none expected. The public archive is unauthenticated and programmatic. Ask only if
    acquisition is blocked by something genuinely the Sponsor's, and name exactly what.

bound_is_not_a_trial:
  rule_id: A12.6
  added_by: amendment-12
  applies_from: F2
  is_a_trial: false
  rule: >
    The bound is a sensitivity re-run of an already-registered variant, not a new trial,
    and it does not inflate the deflation count.
  conditions_under_which_that_holds:
    - the headline level is fixed before the run, for every variant
    - no variant is selected, retained, ranked or promoted on the bound
    - any variant introduced or kept because it looks better at the bound is a POST-HOC
      trial, counts in full in the registry, and is reported separately with the reason
      it was added
  drift_guard_assertion: >
    The criteria evaluation must read the HEADLINE spread level and never the bound.
    Every scored row records the level it was computed at, and the analysis refuses to
    evaluate a criterion on a row that is not at the headline. That defect class has
    already cost this project one worthless grid run.

fx_crossing_invariant:
  rule_id: A12.9
  added_by: amendment-12
  is_a_trial: false
  invariant: >
    The total FX conversion charge must scale with the NUMBER OF TIMES capital actually
    crosses currency, and must not scale with turnover. Converting to the account's
    currency for reporting is reporting, not a charge.
  crossings_per_run: 2
  why_two: >
    The account is funded in EUR and trades USDT-quoted instruments. Capital crosses
    into USDT when it is deployed and back out when it is withdrawn. Rotating between
    USDT-quoted instruments moves no capital across a currency boundary: selling spot
    into USDT and buying another spot out of USDT is one currency throughout.
  asserted_as_a_test: >
    A test holds the invariant directly: doubling the number of rebalances at constant
    capital must not change the FX charge, and doubling the number of crossings must
    double it.
  if_it_scales_with_turnover: >
    it is double-counted, F1's charges decomposition is wrong on its second largest
    line, and the corrected figures are reported in the amendment section rather than
    edited into the original.

relabel_the_assumption:
  rule_id: A12.7
  added_by: amendment-12
  is_a_trial: false
  rule: >
    Wherever the 10 bps figure appears it is labelled a registered UPPER BOUND,
    approximately 18.87 times the measured deep-band half-spread, and never an estimate,
    a conservative estimate or a calibration.
  f1_verdict_amended_not_edited: >
    A new section is added to F1's results document without editing the original text:
    the charges decomposition's largest line rests on that upper bound; with spread and
    slippage at zero, seven of nine variants still lose; therefore F1's (B) stands on
    the counterfactual and not on the assumption, which is precisely why it survives
    this amendment unchanged. An honest (B) that would survive the cost assumption being
    wrong is worth more than one that merely was not challenged.

estimator_result_is_a_finding:
  rule_id: A12.8
  added_by: amendment-12
  is_a_trial: false
  document: docs/SPREAD-ESTIMATORS.md
  rule: >
    The rule E1 result is kept as a methodological finding rather than filed as a failed
    amendment. Abdi-Ranaldo and Corwin-Schultz were tested against measured quoted
    spreads and both failed on magnitude. It is the reason a future version of this
    project must not reach for these estimators again, and it is worth more in the
    repository than the amendment that produced it.

absolute_pairing:
  rule_id: P1
  added_by: amendment-11
  applies_from: F2
  is_a_trial: false
  rule: >
    EVERY criterion that compares a variant to a null is paired with an ABSOLUTE test
    against zero. "Better than a losing null" and "makes money" are different claims,
    and a criterion that states only the first cannot tell them apart.
  why_a_standing_rule_and_not_a_third_patch: >
    The project has confused the two claims three times in three different places: the
    exposure-matched null in SEXTANT-004, criterion 1 as written here, and both of the
    Product Owner's attempts at a floor for rule S1. A patch fixes one site. The defect
    is in the shape of the comparison, so the rule is registered at the level of the
    shape.
  criterion_1_strengthened:
    applies_from: F2
    as_written: >
      an annualised Sharpe above the 95th percentile of the variant's own
      exposure-matched null, AND a strictly positive net return over the scored window.
    weakness: >
      "strictly positive" would pass a variant earning 18.70 EUR on 1,500 across 56
      months. That is a positive number and it is not a return distinguishable from
      nothing.
    as_strengthened: >
      an annualised Sharpe above the 95th percentile of the variant's own
      exposure-matched null, AND a mean scored-period return exceeding ONE STANDARD
      ERROR of that mean. The test is the mean over its own standard deviation times
      the square root of the observation count, strictly greater than one.
    can_only_ever_remove_a_pass: >
      The strengthened clause is strictly narrower than the clause it replaces: a mean
      exceeding its own standard error is positive, so everything the new clause admits
      the old clause admitted. The change can only ever remove a pass and can never add
      one, in any family, on any data. That property is what makes it safe to register
      after F1's figures are known.
    not_applied_to_f1: >
      F1 was judged on the weaker form and its verdict letter is not reopened. The
      strengthened criterion is re-reported against F1's existing figures as a clearly
      labelled SUPPLEMENTARY reading beside the original, which states that F1 was
      judged on the weaker form. A supplementary reading is not a re-scoring.

spread_estimator:
  rule_id: E1
  added_by: amendment-11
  applies_from: F2
  is_a_trial: false
  replaces: >
    the banded spread ASSUMPTION as the default spread cost from F2. This supersedes
    amendment 10's "the measured spread becomes the default": six measured symbol-days
    cannot be a default for a five-year window, and what they are good for is
    calibrating something that can.
  why_the_band_structure_is_the_defect: >
    The bands are cut on quote turnover, spread does not respond to turnover, and the
    36 measured symbol-days found two orders of magnitude of spread INSIDE a single
    band - 0.0357 bps on BTCUSDT against 4.2452 bps on API3USDT, both deep. A better
    constant per band cannot repair a partition cut on the wrong variable. The
    replacement is per instrument and per period rather than per band.
  registered_estimator:
    id: abdi-ranaldo-2017
    citation: >
      Abdi, F. and Ranaldo, A. (2017). A Simple Estimation of Bid-Ask Spreads from
      Daily Close, High, and Low Prices. Review of Financial Studies 30(9), 4437-4480.
    estimator: >
      With c the log close, h the log high, l the log low and eta = (h + l) / 2 the log
      mid-range, the two-day term is s2_t = 4 * (c_t - eta_t) * (c_t - eta_{t+1}), and
      the period estimate is the square root of the MEAN of s2_t over the period. A
      non-positive mean is reported as zero and counted, rather than rooted. The result
      is a PROPORTIONAL effective spread; basis points are 10,000 times it.
    why_this_one: >
      It reports the higher correlation with measured effective spreads of the two
      candidates; it needs only close, high and low, which is exactly what the archive
      holds; and it has no overnight-gap adjustment, so it contains no step at which an
      implementer chooses anything.
  comparison_estimator:
    id: corwin-schultz-2012
    citation: >
      Corwin, S. A. and Schultz, P. (2012). A Simple Way to Estimate Bid-Ask Spreads
      from Daily High and Low Prices. Journal of Finance 67(2), 719-760.
    computed_for: comparison only
    two_day_negatives: >
      set to zero before averaging, which is the paper's own correction, and counted so
      the count is visible.
    overnight_adjustment: >
      applied as the paper states it: when the second day's low is above the first
      day's high, both of the second day's prices are lowered by the gap; when the
      second day's high is below the first day's low, both are raised by it.
    never_substituted: >
      Corwin-Schultz is reported beside Abdi-Ranaldo so a reader can see what was left
      on the table, and it is NEVER adopted if Abdi-Ranaldo fails rule E1. Adopting
      whichever of two estimators passes, after seeing which one passed, is selection
      with one extra step in front of it.
  calibration:
    against: >
      the 36 measured symbol-days in research/spike-006-f1-spread.json: six perpetuals
      on six days, with a time-weighted mean and median quoted spread for each.
    procedure: >
      For each of the six symbols, both estimators are computed over the calendar month
      containing each sampled day, from that symbol's stored daily high, low and close
      on the perpetual venue, and compared against the measured MEDIAN quoted spread of
      the sampled day inside that month. Errors are reported per symbol-month in basis
      points and as a ratio. Per symbol, the estimate is summarised as the median across
      the six months and the measurement as the median across the six days, and the
      ordering clause is computed on those six pairs.
    a_calendar_month_is_not_point_in_time_and_does_not_need_to_be: >
      The calibration month contains the day it is compared against, which would be
      look-ahead in a trading decision and is not one here: nothing is traded on a
      calibration. The window that prices a trade from F2 is trailing and is registered
      separately below.
    what_is_compared_is_not_identical: >
      The estimator estimates an EFFECTIVE spread and the measurement is a QUOTED
      spread. Where trades print at the touch the two coincide; where they do not,
      effective is the smaller of the two. An estimate below the measurement by a small
      factor is therefore consistent with the estimator being right, and this is stated
      before the numbers rather than after them.
  acceptance:
    decided_by: >
      a computed condition on research/spike-006-f1-estimator.json, in exactly the way
      rules C3 and S1 are computed conditions on the result file. Written and committed
      before the calibration was run, and the ordering is checkable in git.
    clauses_all_of_which_must_hold:
      ordering: >
        the Spearman rank correlation between estimated and measured spread across the
        six symbols is at least 0.771, the one-tailed 5 per cent critical value at
        n = 6. A cost model that misranks its instruments is worse than a constant,
        because a cross-sectional strategy trades the ranking.
      magnitude: >
        the median across the six symbols of the absolute base-2 logarithm of estimated
        over measured is at most 1: for at least half the symbols the estimate is within
        a factor of two of the measurement. Against a sample spanning two orders of
        magnitude, a factor of two is a real test rather than a formality.
      positivity: >
        over the F1 window, taking every perpetual with enough stored history in its
        trailing window at every month end, the estimator returns a strictly positive
        figure for at least 90 per cent of the instrument-periods asked of it. A cost
        model cannot charge zero for a spread, and an estimator that is frequently
        non-positive is not a cost.
    if_it_passes: >
      the estimate becomes the default spread cost from F2, per instrument and per
      period, with the banded assumption retained beside it as a labelled alternative,
      and every F2+ result states which of the two it was computed at.
    if_it_fails: >
      the banded ASSUMPTION is kept, labelled an assumption exactly as it is now, and
      the failure is reported with its numbers. A worse number that looks like a
      measurement is worse than a guess that is labelled a guess. No third estimator is
      tried, no clause is relaxed, and the comparison estimator is not promoted.
  application_from_f2:
    point_in_time: >
      The figure charged at a decision instant is estimated from the 30 stored daily
      bars ending STRICTLY BEFORE that instant, which is the same trailing window the
      liquidity bands are already cut on. Estimating from the period a trade falls in
      would use the trade's own month to price the trade.
    insufficient_history: >
      an instrument with fewer than 20 usable two-day pairs in its trailing window is
      charged at the banded ASSUMPTION for its band, labelled as one, and the number of
      such charges is reported. It is never charged zero and never dropped from the
      universe for it.
    halving: >
      The estimate is a full spread and the cost model charges a HALF-spread per leg, so
      half the estimate is what is charged. Section 7.5's measured comparison is stated
      the same way and for the same reason.
    still_an_estimate_under_invariant_12: >
      An estimated spread is reported as an ESTIMATE - neither a measurement nor an
      assumption - with its estimator named and its calibration error beside it wherever
      a cost line depends on it. Invariant 12 is not weakened by adding a third
      provenance; it would be weakened by letting an estimate be printed as a
      measurement.
    slippage_is_untouched: >
      Nothing here estimates slippage. Slippage is an intraday quantity, daily bars
      cannot calibrate it, and it remains an assumption at its registered figures with
      its label attached.
  result:
    computed_on: research/spike-006-f1-estimator.json
    registered_after_the_rule: >
      The rule, the estimator, the comparison and all three thresholds were committed
      before this block existed. This records the outcome, in the same way part 2 of the
      pre-registration records a measurement rather than a choice.
    version_does_not_move_because: >
      This block changes no registered choice: no variant, cell, criterion, threshold,
      budget or rule. It records what a rule already committed at v2.2 computed, which is
      the same thing part 2 of the pre-registration does for the dataset - written only
      once the measurement exists, appended rather than substituted, and never a licence
      to edit a value a result was produced against.
    ordering: >
      HOLDS. Spearman's rho between estimated and measured across the six symbols is
      0.943 against a floor of 0.771, which is one swap of adjacent neighbours. The
      comparison estimator ranks them identically.
    magnitude: >
      FAILS. The median absolute base-2 logarithm of estimated over measured is 6.413
      against a ceiling of 1: a factor of 85. Per symbol the estimate runs from 13.8
      times the measurement to 536 times it, and on BTCUSDT it is zero. The comparison
      estimator is worse, at a median of 6.84 and levels 48 to 2,622 times measured.
    positivity: >
      FAILS. The registered estimator returns a strictly positive figure in 42.6 per cent
      of the 20,615 estimable instrument-periods, against a floor of 90 per cent. A
      further 45,004 of the 65,619 asked for had too few usable pairs, which is a
      listing-history artefact rather than a data defect and is the case the registered
      substitution exists for.
    decision: >
      NOT ADOPTED. Two of three clauses fail, so the banded ASSUMPTION is kept and stays
      labelled an assumption. No third estimator is tried, no clause is relaxed, and the
      comparison estimator is not promoted even though it would clear the positivity
      clause: it clears it by being systematically large, and a cost model that always
      charges about 100 bps is not an improvement on one that sometimes charges nothing.
    why_it_fails: >
      Both estimators read the covariance of the close against the mid-range across
      adjacent days. Each two-day term estimates the squared spread PLUS noise whose
      scale is the daily variance, so the question is a ratio. Resolving BTCUSDT's
      measured spread at one standard error would need about 1.9e15 two-day pairs, some
      five trillion years of daily bars. No choice of window changes that.
    the_implementation_is_not_the_explanation: >
      tests/unit/test_spread_estimator.py simulates a quote-driven market with a known
      spread and recovers it from BOTH estimators at 100 and at 50 basis points, then
      shows both break down as the spread falls relative to the volatility. These
      estimators were validated on equities, where tens of basis points of spread sit
      against daily moves of one or two per cent. A perpetual quoting 0.036 bps against
      four per cent daily volatility is four orders of magnitude outside that regime.
    what_it_leaves_open: >
      Amendment 11 superseded amendment 10's measured deep-band default in favour of an
      estimator that has now failed its own test. So the registered consequence stands -
      the assumption is kept - and the assumption is 10 bps of half-spread on the deep
      band against a measured 0.53. Three options exist: keep the assumption as this
      rule's failure clause says; revert to amendment 10's measured deep-band figure,
      which rule E1 superseded but did not disprove; or run F2 at both and report the
      pair. All three are computed and none is substituted. The choice is the Product
      Owner's before F2 runs.
    changes_no_f1_figure: >
      Every F1 cell is costed at the registered assumption and stays that way. Section
      7.4 shows F1's verdict survives deleting the assumed cost entirely, which is a
      stronger statement than any estimate of it could be.

statistics:
  out_of_sample_only: true
  sharpe: annualised from monthly net returns in EUR
  periods_per_year: 12
  deflated_sharpe:
    citation: bailey-lopez-de-prado-2014-ssrn-2460551
    trial_count_source: >
      research/trial-registry.jsonl, INCLUDING null constructs and INCLUDING every
      trial from every family in this task and every trial from SEXTANT-004 and
      SEXTANT-005 the registry already holds. That is the honest count and it is a
      large one.
    also_reported:
      [
        the strategy-only count,
        the this-family-only count,
        the bar at SEXTANT-005's trial count,
        the bar at this task's trial count,
      ]
    deflation_cost_must_be_readable: >
      Both bars are stated so the deflation this task's wider search costs can be
      read directly.
  bootstrap:
    resamples: 10000
    interval: 95 per cent two-sided
    seed: 987654321
  effective_observations:
    reported_beside_the_raw_count: true
    formulas: both of the two SEXTANT-005 used
    cross_sectional_note: >
      Two carry pairs are two bets on two BASES, and bases can be far less correlated
      than the underlying prices are. Whether they are is measured, not assumed.
  where_statistics_cannot_decide: >
    The report says so and quantifies how far short they fall: the effect size that
    would have been detectable at the available N_eff, and the N_eff that would have
    been needed for the observed effect.

# ---------------------------------------------------------------------------
# Provenance: how a reader verifies the ordering without trusting anyone
# ---------------------------------------------------------------------------
#
# Document section 18. The drift guard proves that the code and this file agree at
# run time. It cannot prove they were not edited together after a result was seen,
# because a check that runs inside the run is written by the same run. Git ordering
# can prove it, and these are the four facts that do it.
provenance:
  config_must_be_committed_before_the_run: true
  runner_refuses_when:
    untracked: >
      This file is not tracked by git. A pre-registration that is not committed
      before the run cannot be shown to have existed before the results.
    dirty: >
      This file has staged or unstaged edits. Its committed SHA describes different
      bytes from the ones the run would read, so citing that SHA would be a false
      statement about the ordering.
  recorded_into_the_results:
    [
      the config's path,
      the config's commit SHA,
      the config's commit instant,
      the config was clean at run time,
      HEAD's SHA at run time,
    ]
  report_must_cite:
    - the config's commit SHA and instant
    - the SHA and instant of the commit that introduced the results file
    - whether the config's commit is an ancestor of the results' commit
  ancestry_is_the_audit: >
    If the config's commit is an ancestor of the commit that introduced the results,
    and the config was clean when the run started, then the specification
    demonstrably existed before the numbers did, and a reader can verify it with two
    git commands rather than by taking anyone's word for it.
  what_it_does_not_prove: >
    That the specification was WISE, or that the eight variants were the right eight.
    Only that they were fixed first. Ordering is a necessary condition for a
    pre-registration to mean anything and it is not a sufficient one.
