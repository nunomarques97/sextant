[project]
name = "sextant"
version = "0.1.0"
description = "Multi-strategy, multi-venue quantitative crypto trading system."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Runtime dependencies are deliberately minimal. Every addition must be justified
# in the ADR of the phase that introduces it. See docs/adr/0001-stack-and-layout.md.
dependencies = [
    "pydantic>=2.9",          # typed boundaries: config, LLM I/O schemas, exchange DTOs
    "pydantic-settings>=2.5", # environment-variable layer and typed settings assembly
    "pyyaml>=6.0.2",          # parsing the layered YAML configuration
    "httpx>=0.27",            # public market data over HTTP; quarantined to adapters.exchanges
    "pyarrow>=17.0",          # parquet bar store; quarantined to adapters.storage
    "duckdb>=1.1",            # queries across the parquet store; quarantined to adapters.storage
    "numpy>=2.1",             # float arrays for the statistics; never for money. ADR 0006
    "scipy>=1.14",            # the normal CDF/quantile the Deflated Sharpe needs. ADR 0006
    "polars>=1.9",            # bulk panel loading; quarantined to adapters.storage. ADR 0006
]

[project.scripts]
sextant = "sextant.app.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "import-linter>=2.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sextant"]

# ------------------------------------------------------------------------------
# ruff
# ------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "ANN",      # flake8-annotations
    "S",        # flake8-bandit
    "A",        # flake8-builtins
    "C4",       # flake8-comprehensions
    "DTZ",      # flake8-datetimez  (naive datetime guard)
    "T20",      # flake8-print      (no stray print in library code)
    "RET",      # flake8-return
    "SIM",      # flake8-simplify
    "TID",      # flake8-tidy-imports
    "PTH",      # flake8-use-pathlib
    "RUF",      # ruff-specific
]
ignore = [
    "ANN401",  # typing.Any is banned outright by mypy strict; no need to also flag it here
]

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test; the "secrets" in tests are deliberate fixtures
# assert is the point of a test; the "secrets" in tests are deliberate fixtures;
# S311 flags `random` as unsuitable for cryptography, which is true and beside the
# point in a seeded, reproducible generative test.
"tests/**" = ["S101", "S105", "S106", "S311"]
"src/sextant/app/cli.py" = ["T20"]   # the CLI is allowed to write to stdout
"src/sextant/app/spike.py" = ["T20"]  # the research spike reports progress on stdout
# The archive stages are long-running batch jobs run by hand. Progress on stdout
# is the whole interface; a logger nobody has configured is not.
"src/sextant/app/archive_ingest.py" = ["T20"]
"src/sextant/app/archive_measure.py" = ["T20"]
"src/sextant/app/universe_snapshot.py" = ["T20"]
"src/sextant/app/null_baseline.py" = ["T20"]
"src/sextant/app/quarter_end_audit.py" = ["T20"]
# S311 flags `random` as unsuitable for cryptography, which is true and
# irrelevant: this is a reproducible simulation and a cryptographic generator
# would be the defect. The generator is explicitly constructed and seeded per
# run - never the global one - so a library imported elsewhere cannot disturb it.
"src/sextant/engine/backtest/baselines.py" = ["S311"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

# ------------------------------------------------------------------------------
# mypy
# ------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
# `disallow_any_explicit` is deliberately NOT set. Every pydantic BaseModel
# subclass inherits `__pydantic_extra__: dict[str, Any]`, so the flag reports an
# error on every model in the project - an incompatibility with a mandated
# dependency, not a finding about our code. The ban on `Any`, `cast()` and
# blanket `# type: ignore` in our own source is enforced instead by
# tests/unit/test_source_hygiene.py, which greps for them.
no_implicit_reexport = true
show_error_codes = true
files = ["src", "tests"]

# pyarrow ships no py.typed marker, so mypy cannot see its signatures. The
# alternative to this override is a `# type: ignore` on every import, and
# blanket ignores in `src` are banned by convention and by
# tests/unit/test_source_hygiene.py. Stated here once, where it is visible,
# rather than four times where it is not. duckdb does ship types and needs no
# entry. Values crossing this boundary are narrowed explicitly at the call
# site - int(), str(), bool() - so nothing untyped escapes adapters.storage.
[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

# scipy ships no py.typed marker either. numpy and polars both do, and need no
# entry. Only `scipy.stats.norm` is used, in one module, and its two call sites
# are wrapped in float() so nothing untyped escapes engine.statistics.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

# ------------------------------------------------------------------------------
# pytest
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["src/sextant"]

[tool.coverage.report]
show_missing = true
# The gate, not the target. Coverage fell from 90% to 73% across SEXTANT-002
# without anything failing, which is how a suite stops being evidence. 85% is
# deliberately below where the suite actually sits, so that this fires on a real
# regression rather than on ordinary churn. Raise it when the headroom is dull.
fail_under = 85
