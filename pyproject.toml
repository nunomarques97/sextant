[project]
name = "sextant"
version = "0.1.0"
description = "Multi-strategy, multi-venue quantitative crypto trading system."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Runtime dependencies are deliberately minimal. Every addition must be justified
# in the ADR of the phase that introduces it. See docs/adr/0001-stack-and-layout.md.
dependencies = [
    "pydantic>=2.9",          # typed boundaries: config, LLM I/O schemas, exchange DTOs
    "pydantic-settings>=2.5", # environment-variable layer and typed settings assembly
    "pyyaml>=6.0.2",          # parsing the layered YAML configuration
]

[project.scripts]
sextant = "sextant.app.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "import-linter>=2.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sextant"]

# ------------------------------------------------------------------------------
# ruff
# ------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "ANN",      # flake8-annotations
    "S",        # flake8-bandit
    "A",        # flake8-builtins
    "C4",       # flake8-comprehensions
    "DTZ",      # flake8-datetimez  (naive datetime guard)
    "T20",      # flake8-print      (no stray print in library code)
    "RET",      # flake8-return
    "SIM",      # flake8-simplify
    "TID",      # flake8-tidy-imports
    "PTH",      # flake8-use-pathlib
    "RUF",      # ruff-specific
]
ignore = [
    "ANN401",  # typing.Any is banned outright by mypy strict; no need to also flag it here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]                # assert is the point of a test
"src/sextant/app/cli.py" = ["T20"]   # the CLI is allowed to write to stdout

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

# ------------------------------------------------------------------------------
# mypy
# ------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_explicit = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
files = ["src", "tests"]

# ------------------------------------------------------------------------------
# pytest
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["src/sextant"]

[tool.coverage.report]
show_missing = true
