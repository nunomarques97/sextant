[project]
name = "sextant"
version = "0.1.0"
description = "Multi-strategy, multi-venue quantitative crypto trading system."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Runtime dependencies are deliberately minimal. Every addition must be justified
# in the ADR of the phase that introduces it. See docs/adr/0001-stack-and-layout.md.
dependencies = [
    "pydantic>=2.9",          # typed boundaries: config, LLM I/O schemas, exchange DTOs
    "pydantic-settings>=2.5", # environment-variable layer and typed settings assembly
    "pyyaml>=6.0.2",          # parsing the layered YAML configuration
    "httpx>=0.27",            # public market data over HTTP; quarantined to adapters.exchanges
    "pyarrow>=17.0",          # parquet bar store; quarantined to adapters.storage
    "duckdb>=1.1",            # queries across the parquet store; quarantined to adapters.storage
]

[project.scripts]
sextant = "sextant.app.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "import-linter>=2.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sextant"]

# ------------------------------------------------------------------------------
# ruff
# ------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "ANN",      # flake8-annotations
    "S",        # flake8-bandit
    "A",        # flake8-builtins
    "C4",       # flake8-comprehensions
    "DTZ",      # flake8-datetimez  (naive datetime guard)
    "T20",      # flake8-print      (no stray print in library code)
    "RET",      # flake8-return
    "SIM",      # flake8-simplify
    "TID",      # flake8-tidy-imports
    "PTH",      # flake8-use-pathlib
    "RUF",      # ruff-specific
]
ignore = [
    "ANN401",  # typing.Any is banned outright by mypy strict; no need to also flag it here
]

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test; the "secrets" in tests are deliberate fixtures
"tests/**" = ["S101", "S105", "S106"]
"src/sextant/app/cli.py" = ["T20"]   # the CLI is allowed to write to stdout
"src/sextant/app/spike.py" = ["T20"]  # the research spike reports progress on stdout

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

# ------------------------------------------------------------------------------
# mypy
# ------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
# `disallow_any_explicit` is deliberately NOT set. Every pydantic BaseModel
# subclass inherits `__pydantic_extra__: dict[str, Any]`, so the flag reports an
# error on every model in the project - an incompatibility with a mandated
# dependency, not a finding about our code. The ban on `Any`, `cast()` and
# blanket `# type: ignore` in our own source is enforced instead by
# tests/unit/test_source_hygiene.py, which greps for them.
no_implicit_reexport = true
show_error_codes = true
files = ["src", "tests"]

# ------------------------------------------------------------------------------
# pytest
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["src/sextant"]

[tool.coverage.report]
show_missing = true
# The gate, not the target. Coverage fell from 90% to 73% across SEXTANT-002
# without anything failing, which is how a suite stops being evidence. 85% is
# deliberately below where the suite actually sits, so that this fires on a real
# regression rather than on ordinary churn. Raise it when the headroom is dull.
fail_under = 85
